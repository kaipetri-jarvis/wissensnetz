<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kais KI-Gehirn · 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  /* ---- Ökosystem-Station header (brand + clock + stat cards), like the old Station ---- */
  #top {
    position: fixed; z-index: 10; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 10px) + 12px) 16px 10px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    background: linear-gradient(180deg, rgba(2,4,10,0.9), rgba(2,4,10,0)); pointer-events: none;
  }
  #top .brand h1 {
    margin: 0; font-size: clamp(16px, 4.6vw, 26px); font-weight: 800; letter-spacing: -0.4px; line-height: 1.05;
    background: linear-gradient(92deg, #fff, #cfd8ff 42%, #b28dff 74%, #74e39a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 26px rgba(111,180,255,0.18);
  }
  #top .brand .sub { margin-top: 4px; color: #7ba0d0; font-size: clamp(10px, 2.6vw, 13px); font-style: italic; }
  #top .clock { text-align: right; min-width: 96px; }
  #top .clock .time { font-variant-numeric: tabular-nums; font-size: clamp(15px, 3.6vw, 24px); font-weight: 700; letter-spacing: 1px; color: #fff; text-shadow: 0 0 18px rgba(143,215,255,0.4); }
  #top .clock .live { display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; font-size: clamp(8px,2.2vw,10px); color: #74e39a; letter-spacing: 0.14em; text-transform: uppercase; }
  #top .clock .pdot { width: 7px; height: 7px; border-radius: 50%; background: #74e39a; box-shadow: 0 0 10px #74e39a; animation: pulseDot 1.8s infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.32;transform:scale(.65)} }
  #stats {
    position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 10px) + 56px); left: 16px; right: 16px;
    display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none;
  }
  #stats .stat {
    background: rgba(8,14,28,0.6); border: 1px solid rgba(90,150,255,0.2); border-radius: 12px;
    padding: 6px 12px; backdrop-filter: blur(10px); min-width: 82px; position: relative; overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  #stats .stat::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; opacity:.7; }
  #stats .a::before{background:linear-gradient(90deg,transparent,#ffd166,transparent)}
  #stats .b::before{background:linear-gradient(90deg,transparent,#b28dff,transparent)}
  #stats .c::before{background:linear-gradient(90deg,transparent,#74e39a,transparent)}
  #stats .d::before{background:linear-gradient(90deg,transparent,#66e0ff,transparent)}
  #stats .n { font-size: clamp(15px,3.8vw,21px); font-weight: 800; letter-spacing:-0.4px; line-height:1; }
  #stats .n span { font-size: .55em; opacity: .85; }
  #stats .l { font-size: clamp(8px,2vw,9.5px); color: #7ba0d0; margin-top: 3px; letter-spacing: .05em; text-transform: uppercase; }
  #stats .a .n{color:#ffd166} #stats .b .n{color:#b28dff} #stats .c .n{color:#74e39a} #stats .d .n{color:#66e0ff}
  @media (max-width: 560px) { #stats .stat { min-width: 0; flex: 1 1 40%; padding: 6px 10px; } }
  #hint {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 10px) + 6px); left: 0; right: 0; text-align: center;
    color: #5a7aa8; font-size: clamp(10px, 3vw, 11px); pointer-events: none; z-index: 10; padding: 0 12px;
  }
  .label {
    position: absolute; transform: translate(-50%, -50%);
    color: #eaf4ff; font-size: clamp(11px, 3.4vw, 13px); font-weight: 700; letter-spacing: 0.2px;
    text-shadow: 0 0 6px rgba(0,0,0,0.95);
    pointer-events: none; white-space: nowrap; z-index: 5;
    padding: 3px 9px 3px 8px; border-radius: 9px;
    background: rgba(6,12,26,0.72);
    border: 1px solid var(--acol, rgba(90,150,255,0.5));
    box-shadow: 0 0 10px var(--aglow, rgba(60,140,255,0.35)), inset 0 0 6px rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 6px;
  }
  .label::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--acol, #6cf); box-shadow: 0 0 8px var(--acol, #6cf);
    flex: 0 0 auto;
  }
  .label.ki { font-size: clamp(11.5px, 3.7vw, 14px); border-width: 1.5px;
    background: rgba(8,14,30,0.8); box-shadow: 0 0 14px var(--aglow, rgba(60,140,255,0.5)); }
  /* Terminal panel (echo of the old "RECHERCHE-TERMINAL" station log) */
  #terminal {
    position: fixed; z-index: 11; left: 12px; bottom: calc(env(safe-area-inset-bottom, 10px) + 30px);
    width: min(340px, 78vw); max-height: 168px; overflow: hidden;
    background: rgba(4,10,22,0.82); border: 1px solid rgba(90,150,255,0.32);
    border-radius: 10px; box-shadow: 0 0 22px rgba(30,90,190,0.28);
    backdrop-filter: blur(3px); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #terminal .thead {
    display: flex; align-items: center; gap: 7px; padding: 6px 10px;
    border-bottom: 1px solid rgba(90,150,255,0.2); color: #8fd0ff;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
  }
  #terminal .dot { width: 8px; height: 8px; border-radius: 50%; background: #46e08a; box-shadow: 0 0 8px #46e08a; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }
  #terminal .tbody { padding: 6px 10px 8px; font-size: 10px; line-height: 1.5; color: #9fc4e8; }
  #terminal .tbody .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #terminal .tbody .ln .tk { color: #6ee0ff; }
  #terminal .tbody .ln .ok { color: #46e08a; }
  #terminal.min .tbody { display: none; }
  #terminal .thead { cursor: pointer; pointer-events: auto; }
  @media (max-width: 560px) {
    #terminal { width: min(300px, 82vw); max-height: 132px; }
    #terminal .tbody { font-size: 9.5px; }
  }
</style>
</head>
<body>
<div id="top">
  <div class="brand">
    <h1>🧠 Kais KI-Gehirn · Die Station</h1>
    <div class="sub">Meine Agenten arbeiten, während ich schlafe.</div>
  </div>
  <div class="clock">
    <div class="time" id="clock">–</div>
    <div class="live"><span class="pdot"></span> Station aktiv</div>
  </div>
</div>
<div id="stats">
  <div class="stat a"><div class="n">19<span>+4</span></div><div class="l">Produkte · Bundles</div></div>
  <div class="stat b"><div class="n">17</div><div class="l">verkaufsf. ZIPs</div></div>
  <div class="stat c"><div class="n">14</div><div class="l">Thumbnails · Ø 8–9,5</div></div>
  <div class="stat d"><div class="n">3</div><div class="l">KI-Modelle</div></div>
</div>
<div id="app"></div>
<div id="hint">Ziehen zum Drehen · Pinch/Scroll zum Zoomen</div>
<div id="labels"></div>
<div id="terminal">
  <div class="thead" onclick="this.parentElement.classList.toggle('min')"><span class="dot"></span>RECHERCHE-TERMINAL · eRank · Live-Etsy</div>
  <div class="tbody" id="tbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene = new THREE.Scene();
const app = document.getElementById('app');
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 135);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
app.appendChild(renderer.domElement);

// ---- Brain point cloud (two hemispheres, folded surface) ----
const brainGroup = new THREE.Group();
scene.add(brainGroup);

const R = 32; // brain radius scale
const points = [];

// Single closed anatomical brain (side-profile): a solid ellipsoidal volume,
// elongated front-back (z), rounded top, flattened bottom, with a brain-stem nub,
// and a fine gyri (fold) ripple so the surface reads as a real brain.
const NUM = 3000;
for (let i = 0; i < NUM; i++) {
  const u = Math.random();
  const v = Math.random();
  const theta = 2 * Math.PI * u;             // around
  const phi = Math.acos(2 * v - 1);          // pole to pole

  // gyri folds: fine surface ripple (thickness in the shell), same everywhere -> continuous brain
  const fold = 1
    + 0.10 * Math.sin(theta * 8.0)
    + 0.08 * Math.sin(phi * 7.0 + theta * 2.0)
    + 0.05 * Math.cos(theta * 13.0);
  const rr = fold * (0.9 + Math.random() * 0.12);

  let x = rr * Math.sin(phi) * Math.cos(theta) * 0.78;  // width (left-right, thinner in profile)
  let y = rr * Math.sin(phi) * Math.sin(theta) * 0.82;  // height
  let z = rr * Math.cos(phi) * 1.30;                    // front-back (elongated)

  // round crown / flatten underside: lift-flatten the bottom like a real brain base
  if (y < -0.35) { y = -0.35 + (y + 0.35) * 0.5; }
  // frontal lobe bulge (front = +z): swell the top-front slightly
  if (z > 0.5 && y > 0.1) { z *= 1.06; }

  points.push(new THREE.Vector3(x * R, y * R, z * R));
}

// brain-stem / cerebellum nub hanging under the back-bottom
const STEM = 260;
for (let i = 0; i < STEM; i++) {
  const a = Math.random() * Math.PI * 2;
  const rad = (0.28 + Math.random() * 0.22) * R;
  const drop = (0.2 + Math.random() * 0.8);
  const x = Math.cos(a) * rad * 0.45 * (1 - drop*0.4);
  const y = (-0.55 - drop * 0.65) * R;
  const z = (-0.35 + Math.sin(a) * 0.25) * R - drop * 0.3 * R;
  points.push(new THREE.Vector3(x, y, z));
}

// point cloud geometry
const posArr = new Float32Array(points.length * 3);
points.forEach((p, i) => { posArr[i*3]=p.x; posArr[i*3+1]=p.y; posArr[i*3+2]=p.z; });
const ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

// glowing sprite for points
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0, 'rgba(180,220,255,1)');
  grd.addColorStop(0.25, 'rgba(90,170,255,0.9)');
  grd.addColorStop(0.6, 'rgba(40,110,220,0.35)');
  grd.addColorStop(1, 'rgba(20,60,140,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); return t;
}
const glowTex = makeGlowTexture();

const ptMat = new THREE.PointsMaterial({
  size: 2.2, map: glowTex, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, color: 0x66b3ff, opacity: 0.95
});
const cloud = new THREE.Points(ptGeo, ptMat);
cloud.renderOrder = 1;
brainGroup.add(cloud);

// ---- Glass brain shell: a smooth translucent surface with glowing edges (fresnel) ----
// Deform a sphere into the same side-profile brain shape + gyri folds, so it reads
// as a real glassy brain (like the reference image) enclosing the neural point cloud.
// Cortical fold field: value in ~[-1,1] that carves the sulci (grooves) and
// raises the gyri (ridges). High-frequency, direction-mixed sine layers give an
// organic wrinkled-walnut surface rather than smooth folds.
function corticalFold(x, y, z) {
  return (
      Math.sin(x*7.3 + Math.cos(z*5.1)*2.0)
    * Math.cos(y*6.7 + Math.sin(x*4.3)*2.0)
    + 0.6 * Math.sin(z*9.1 + Math.cos(y*7.7)*1.5)
    * Math.cos(x*8.3 + Math.sin(z*6.1)*1.5)
    + 0.4 * Math.sin((x+y+z)*11.0)
  ) / 2.0;
}
function brainShape(x, y, z) {
  // x,y,z are unit-sphere coords; return the deformed brain-space position (already *R)
  const fold = 1
    + 0.055 * Math.sin(Math.atan2(z, x) * 8.0)
    + 0.045 * Math.sin(Math.asin(Math.max(-1,Math.min(1,y))) * 7.0)
    + 0.03  * Math.cos(Math.atan2(z, x) * 13.0);
  // press real gyri/sulci into the surface along the radius
  const wrinkle = 1 + 0.075 * corticalFold(x, y, z);
  const f = fold * wrinkle;
  let px = x * 0.78 * f;
  let py = y * 0.82 * f;
  let pz = z * 1.30 * f;
  if (py < -0.35) py = -0.35 + (py + 0.35) * 0.5;   // flatten underside
  if (pz > 0.5 && py > 0.1) pz *= 1.06;             // frontal bulge
  return [px * R, py * R, pz * R];
}
// Glass shader material for the REAL anatomical brain mesh (loaded from brain.glb).
// Fresnel rim + normal-based sheen make it read as glowing blue glass, and because
// the mesh has real gyri/sulci geometry the folds are anatomically correct.
const glassMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0x7cc4ff) }, uEdge: { value: new THREE.Color(0xe6f4ff) } },
  vertexShader: `
    varying vec3 vN; varying vec3 vView; varying vec3 vWorld;
    void main(){
      vec4 wp = modelViewMatrix * vec4(position,1.0);
      vN = normalize(normalMatrix * normal);
      vView = normalize(-wp.xyz);
      vWorld = position;
      gl_Position = projectionMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uColor; uniform vec3 uEdge;
    varying vec3 vN; varying vec3 vView; varying vec3 vWorld;
    void main(){
      vec3 N = normalize(vN);
      float fres = pow(1.0 - abs(dot(N, normalize(vView))), 2.2);   // bright glass rim
      // crease shading from surface curvature proxy: normal facing sideways = groove wall
      float crease = 0.5 + 0.5 * N.y;
      float sheen = 0.5 + 0.5*sin(vWorld.x*4.0 + vWorld.z*3.0 + uTime*0.6);
      vec3 col = mix(uColor*0.14, uEdge, fres);
      col += uColor * crease * 0.10;
      col += uColor * sheen * 0.04;
      float a = fres*0.9 + 0.10;
      gl_FragColor = vec4(col, a);
    }`
});

// Load the real brain model, fit it to the brain group's scale, apply glass material.
let glassBrain = null;
const R2 = R; // target radius (matches the neural cloud extent)
const loader = new THREE.GLTFLoader();
loader.load('assets/brain.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.material = glassMat; o.renderOrder = 2; } });
  // center + scale to match the neural point cloud (~R across)
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const s = (R2 * 2.15) / maxDim;
  model.scale.setScalar(s);
  model.position.sub(center.multiplyScalar(s));
  model.updateWorldMatrix(true, true);
  glassBrain = model;
  brainGroup.add(model);

  // ---- Rebuild the neural point cloud by sampling the REAL brain surface, so the
  // glowing points sit exactly inside the mesh (they were offset before). ----
  const tris = [];
  const tmp = new THREE.Vector3();
  model.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    const pos = g.attributes.position;
    const idx = g.index;
    o.updateWorldMatrix(true, false);
    const m = o.matrixWorld;
    const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
    const n = idx ? idx.count : pos.count;
    for (let i = 0; i < n; i += 3) {
      const a = idx ? idx.getX(i)   : i;
      const b = idx ? idx.getX(i+1) : i+1;
      const c = idx ? idx.getX(i+2) : i+2;
      va.fromBufferAttribute(pos, a).applyMatrix4(m);
      vb.fromBufferAttribute(pos, b).applyMatrix4(m);
      vc.fromBufferAttribute(pos, c).applyMatrix4(m);
      // convert from model-local (brainGroup) space: matrixWorld includes brainGroup,
      // but brainGroup has no offset yet at load time, so this is brainGroup-local.
      tris.push([va.x,va.y,va.z, vb.x,vb.y,vb.z, vc.x,vc.y,vc.z]);
    }
  });
  if (tris.length) {
    const N = 3600;
    const sampled = new Float32Array(N * 3);
    const pts = [];
    for (let i = 0; i < N; i++) {
      const t = tris[(Math.random()*tris.length)|0];
      let r1 = Math.random(), r2 = Math.random();
      if (r1 + r2 > 1) { r1 = 1 - r1; r2 = 1 - r2; }
      const r0 = 1 - r1 - r2;
      // pull inward (0.6..1.0) so points fill the whole volume, not just the shell
      const k = 0.60 + Math.random() * 0.40;
      const px = (t[0]*r0 + t[3]*r1 + t[6]*r2) * k;
      const py = (t[1]*r0 + t[4]*r1 + t[7]*r2) * k;
      const pz = (t[2]*r0 + t[5]*r1 + t[8]*r2) * k;
      sampled[i*3]=px; sampled[i*3+1]=py; sampled[i*3+2]=pz;
      pts.push(new THREE.Vector3(px, py, pz));
    }
    ptGeo.setAttribute('position', new THREE.BufferAttribute(sampled, 3));
    ptGeo.attributes.position.needsUpdate = true;

    // rebuild neural connection lines from the in-brain points (old ones used the sphere)
    const lp = [];
    for (let i = 0; i < pts.length; i += 2) {
      let found = 0;
      for (let j = i + 1; j < pts.length && found < 3; j++) {
        if (pts[i].distanceTo(pts[j]) < 7.5) { lp.push(pts[i].x,pts[i].y,pts[i].z, pts[j].x,pts[j].y,pts[j].z); found++; }
      }
    }
    lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp), 3));
    lineGeo.attributes.position.needsUpdate = true;

    // rebuild core filaments to end on real in-brain points
    const fp = [];
    for (let i = 0; i < 45; i++) {
      const p = pts[(Math.random()*pts.length)|0];
      fp.push((Math.random()-0.5)*4,(Math.random()-0.5)*4,(Math.random()-0.5)*4, p.x*0.92,p.y*0.92,p.z*0.92);
    }
    filGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fp), 3));
    filGeo.attributes.position.needsUpdate = true;
  }
  window.__brainLoaded = true;                      // marker for render verification
}, undefined, (err) => { console.error('brain.glb load failed', err); window.__brainLoadError = String(err); });

// dim the inner point cloud so the glass surface reads as the main form
ptMat.opacity = 0.55;
ptMat.size = 1.8;

// ---- Neural connection lines (nearest neighbors) ----
const linePos = [];
const maxLinks = 3, linkDist = 7.5;
for (let i = 0; i < points.length; i += 2) {
  let found = 0;
  for (let j = i + 1; j < points.length && found < maxLinks; j++) {
    if (points[i].distanceTo(points[j]) < linkDist) {
      linePos.push(points[i].x, points[i].y, points[i].z, points[j].x, points[j].y, points[j].z);
      found++;
    }
  }
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePos), 3));
const lineMat = new THREE.LineBasicMaterial({ color: 0x2f7fe0, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false });
const lines = new THREE.LineSegments(lineGeo, lineMat);
brainGroup.add(lines);

// ---- Core glow at center ----
const coreMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xcfeaff, transparent: true, blending: THREE.AdditiveBlending, opacity: 1.0, depthWrite:false });
const core = new THREE.Sprite(coreMat);
core.scale.set(42, 42, 1);
brainGroup.add(core);

// ---- Bright filaments radiating from the core out toward the surface ----
// (the neuron-firing burst seen in the reference image)
const filPos = [];
const FIL = 45;
for (let i = 0; i < FIL; i++) {
  const p = points[(Math.random()*points.length)|0];
  // start near core (jittered), end at a surface point
  filPos.push(
    (Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4,
    p.x*0.92, p.y*0.92, p.z*0.92
  );
}
const filGeo = new THREE.BufferGeometry();
filGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(filPos), 3));
const filMat = new THREE.LineBasicMaterial({ color: 0x9fd8ff, transparent:true, opacity:0.16, blending:THREE.AdditiveBlending, depthWrite:false });
const filaments = new THREE.LineSegments(filGeo, filMat);
brainGroup.add(filaments);

// ---- Agent satellites (outside, accessing the brain) ----
const AD = 64; // agent orbit distance (closer so labels stay in frame)
const agents = [
  { name: 'Jarvis',   color: 0x66e0ff, angle: 0.0,          dist: AD, y: 10 },
  { name: 'Ultron',   color: 0xff7a7a, angle: Math.PI*0.25, dist: AD, y: -16 },
  { name: 'ATLAS',    color: 0xffd166, angle: Math.PI*0.5,  dist: AD, y: 20 },
  { name: 'Gemini',   color: 0xb28dff, angle: Math.PI*0.75, dist: AD, y: -6 },
  { name: 'ChatGPT',  color: 0x74e39a, angle: Math.PI,      dist: AD, y: 18 },
  { name: 'Etsy',     color: 0xff9f68, angle: Math.PI*1.25, dist: AD, y: -20 },
  { name: 'Telegram', color: 0x69b7ff, angle: Math.PI*1.5,  dist: AD, y: 8 },
  { name: 'Memory',   color: 0xa0f0d0, angle: Math.PI*1.75, dist: AD, y: -10 },
];

const agentGroup = new THREE.Group();
scene.add(agentGroup);
const labelsDiv = document.getElementById('labels');
const agentObjs = [];

agents.forEach(a => {
  const pos = new THREE.Vector3(Math.cos(a.angle)*a.dist, a.y, Math.sin(a.angle)*a.dist);
  // node sprite
  const mat = new THREE.SpriteMaterial({ map: glowTex, color: a.color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(9, 9, 1); sp.position.copy(pos);
  agentGroup.add(sp);

  // access line from agent into the brain: target the nearest surface point
  let target = points[0].clone(), best = Infinity;
  for (let s = 0; s < points.length; s += 5) {
    const d = points[s].distanceTo(pos);
    if (d < best) { best = d; target = points[s].clone(); }
  }
  const alGeo = new THREE.BufferGeometry();
  alGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([pos.x,pos.y,pos.z, target.x,target.y,target.z]), 3));
  const alMat = new THREE.LineBasicMaterial({ color: a.color, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending, depthWrite:false });
  const al = new THREE.Line(alGeo, alMat);
  agentGroup.add(al);

  // traveling pulse along the line
  const pulseMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const pulse = new THREE.Sprite(pulseMat); pulse.scale.set(5,5,1);
  agentGroup.add(pulse);

  // highlight labels: KI models get a stronger 'ki' style, all get their agent color
  const KI_MODELS = ['Jarvis','Ultron','Gemini','ChatGPT','ATLAS'];
  const label = document.createElement('div');
  label.className = 'label' + (KI_MODELS.includes(a.name) ? ' ki' : '');
  label.textContent = a.name;
  const hex = '#' + a.color.toString(16).padStart(6,'0');
  label.style.setProperty('--acol', hex);
  label.style.setProperty('--aglow', hex + '88');
  labelsDiv.appendChild(label);

  agentObjs.push({ sp, pos, target, al, pulse, label, color: a.color, phase: Math.random()*Math.PI*2 });
});

// ---- Cyber background: grid plane + floating data particles ----
const bgGroup = new THREE.Group();
scene.add(bgGroup);

// faint circuit grid far behind the brain
const grid = new THREE.GridHelper(700, 56, 0x1a5fa0, 0x0f3a6a);
grid.material.transparent = true; grid.material.opacity = 0.22;
grid.position.set(0, -62, -130);
grid.rotation.x = Math.PI * 0.04;
bgGroup.add(grid);

// second grid overhead for a "data corridor" feel
const grid2 = new THREE.GridHelper(700, 56, 0x14507f, 0x0c2e58);
grid2.material.transparent = true; grid2.material.opacity = 0.12;
grid2.position.set(0, 78, -130);
grid2.rotation.x = -Math.PI * 0.04;
bgGroup.add(grid2);

// ---- Horizontal data stream: a flat band of circuit lines flowing out sideways
// (the horizontal data current on either side of the brain in the reference image) ----
const streamGroup = new THREE.Group();
bgGroup.add(streamGroup);
const streamPos = [];        // long horizontal circuit traces at brain height
const STREAM_LINES = 90;
for (let i = 0; i < STREAM_LINES; i++) {
  const side = Math.random() < 0.5 ? -1 : 1;           // left or right of the brain
  const x0 = side * (58 + Math.random()*30);           // start just outside the brain
  const x1 = side * (58 + 200 + Math.random()*140);    // run far out to the side
  const y  = (Math.random()-0.5) * 46;                 // spread across brain height
  const z  = (Math.random()-0.5) * 90 - 20;            // some depth
  streamPos.push(x0, y, z,  x1, y, z);
}
const streamGeo = new THREE.BufferGeometry();
streamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(streamPos), 3));
const streamMat = new THREE.LineBasicMaterial({ color: 0x2f8fe0, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, depthWrite:false });
streamGroup.add(new THREE.LineSegments(streamGeo, streamMat));

// glowing data packets travelling along the stream lines
const PKT = 70;
const pktPos = new Float32Array(PKT * 3);
const pktData = [];
for (let i = 0; i < PKT; i++) {
  const li = (Math.random()*STREAM_LINES)|0;
  const ax0 = streamPos[li*6], ay = streamPos[li*6+1], az = streamPos[li*6+2], ax1 = streamPos[li*6+3];
  pktData.push({ x0: ax0, x1: ax1, y: ay, z: az, u: Math.random(), sp: 0.15 + Math.random()*0.5 });
}
const pktGeo = new THREE.BufferGeometry();
pktGeo.setAttribute('position', new THREE.BufferAttribute(pktPos, 3));
const pktMat = new THREE.PointsMaterial({ size: 3.0, map: glowTex, color: 0xbfe4ff, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
const packets = new THREE.Points(pktGeo, pktMat);
streamGroup.add(packets);

// HUD panels: glowing rectangular circuit outlines lying on the floor plane
function hudRect(w, h) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-w/2,0,-h/2), new THREE.Vector3(w/2,0,-h/2),
    new THREE.Vector3(w/2,0,h/2), new THREE.Vector3(-w/2,0,h/2),
    new THREE.Vector3(-w/2,0,-h/2),
  ]);
  return g;
}
const hudDefs = [
  { x:-95, z: 30, w: 34, h: 22, c: 0x3aa0ff },
  { x: 100, z: 20, w: 40, h: 26, c: 0x59c0ff },
  { x:-70, z: -55, w: 26, h: 18, c: 0x2f80d0 },
  { x: 78, z: -60, w: 30, h: 20, c: 0x59c0ff },
  { x: 0,  z: 95, w: 50, h: 16, c: 0x3aa0ff },
];
const hudPanels = [];
hudDefs.forEach(d => {
  const line = new THREE.Line(hudRect(d.w, d.h), new THREE.LineBasicMaterial({ color:d.c, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false }));
  line.position.set(d.x, -50, d.z);
  bgGroup.add(line);
  // inner tick line for a circuit feel
  const inner = new THREE.Line(hudRect(d.w*0.6, d.h*0.5), new THREE.LineBasicMaterial({ color:d.c, transparent:true, opacity:0.25, blending:THREE.AdditiveBlending, depthWrite:false }));
  inner.position.set(d.x, -49.8, d.z);
  bgGroup.add(inner);
  hudPanels.push(line.material, inner.material);
});

// ---- Data sphere: shell of floating data points enclosing the brain ----
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);
const DN = 900;
const dsPos = new Float32Array(DN * 3);
const dsBase = []; // store base spherical coords for gentle animated shimmer
const SHELL = 58;
for (let i = 0; i < DN; i++) {
  // even distribution on a sphere (fibonacci sphere) + slight thickness
  const y = 1 - (i / (DN - 1)) * 2;
  const rad = Math.sqrt(1 - y*y);
  const phi = i * Math.PI * (3 - Math.sqrt(5));
  const rr = SHELL * (0.92 + Math.random()*0.14);
  const x = Math.cos(phi) * rad, z = Math.sin(phi) * rad;
  dsPos[i*3]   = x * rr;
  dsPos[i*3+1] = y * rr;
  dsPos[i*3+2] = z * rr;
  dsBase.push({ x, y, z, r: rr, ph: Math.random()*Math.PI*2 });
}
const dsGeo = new THREE.BufferGeometry();
dsGeo.setAttribute('position', new THREE.BufferAttribute(dsPos, 3));
const dsMat = new THREE.PointsMaterial({ size: 2.0, map: glowTex, color: 0x69c0ff, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false });
const dataSphere = new THREE.Points(dsGeo, dsMat);
// NOTE: the enclosing data sphere is disabled — Kai wants the glowing points INSIDE
// the brain, not floating around it. Kept the object so the animation loop stays valid.
dataSphere.visible = false;
sphereGroup.add(dataSphere);

// ---- Energy waves pulsing outward from the core ----
const WAVES = 3;
const waveObjs = [];
for (let i = 0; i < WAVES; i++) {
  const pts = [];
  const seg = 64;
  for (let a = 0; a <= seg; a++) { const ang = a/seg*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color: 0x9fe0ff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const ring = new THREE.Line(g, m);
  brainGroup.add(ring);
  waveObjs.push({ ring, m, t: i / WAVES });
}

// ---- Holographic circuit rings orbiting the brain (HUD look) ----
const ringGroup = new THREE.Group();
scene.add(ringGroup);
const ringObjs = [];
const ringDefs = [
  { r: 52, col: 0x3ea6ff, tilt: [Math.PI*0.5, 0, 0],            spin: 0.15,  seg: 96, dash: true },
  { r: 62, col: 0x2f7fe0, tilt: [Math.PI*0.42, Math.PI*0.15, 0],spin: -0.10, seg: 96, dash: false },
  { r: 46, col: 0x8fd0ff, tilt: [Math.PI*0.5, 0, Math.PI*0.3],  spin: 0.22,  seg: 72, dash: true },
];
ringDefs.forEach(rd => {
  const pts = [];
  for (let a = 0; a <= rd.seg; a++) {
    const ang = (a/rd.seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(ang)*rd.r, Math.sin(ang)*rd.r, 0));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = rd.dash
    ? new THREE.LineDashedMaterial({ color: rd.col, transparent:true, opacity:0.5, dashSize:3, gapSize:3, blending:THREE.AdditiveBlending, depthWrite:false })
    : new THREE.LineBasicMaterial({ color: rd.col, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false });
  const line = new THREE.Line(g, m);
  if (rd.dash) line.computeLineDistances();
  line.rotation.set(rd.tilt[0], rd.tilt[1], rd.tilt[2]);
  ringGroup.add(line);

  // little data-nodes riding on the ring
  const nodeCount = 6;
  const nodes = [];
  for (let n = 0; n < nodeCount; n++) {
    const sMat = new THREE.SpriteMaterial({ map: glowTex, color: rd.col, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
    const sp = new THREE.Sprite(sMat); sp.scale.set(4,4,1);
    line.add(sp);
    nodes.push({ sp, base: (n/nodeCount)*Math.PI*2 });
  }
  ringObjs.push({ line, spin: rd.spin, r: rd.r, nodes });
});

// ---- Electric spark bolts arcing through the brain net ----
const SPARKS = 7;
const sparkObjs = [];
for (let i = 0; i < SPARKS; i++) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6*3), 3)); // up to 6 segment nodes
  const mat = new THREE.LineBasicMaterial({ color: 0xbfe4ff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  const bolt = new THREE.Line(geo, mat);
  brainGroup.add(bolt);
  sparkObjs.push({ bolt, geo, mat, life: 0, ttl: 0, next: Math.random()*1.5 });
}

// build a jagged bolt between two random brain points
function fireSpark(s) {
  const a = points[(Math.random()*points.length)|0];
  const b = points[(Math.random()*points.length)|0];
  const seg = 5;
  const arr = s.geo.attributes.position.array;
  for (let k = 0; k <= seg; k++) {
    const tt = k/seg;
    const jitter = (k===0||k===seg) ? 0 : 4;
    arr[k*3]   = a.x + (b.x-a.x)*tt + (Math.random()-0.5)*jitter;
    arr[k*3+1] = a.y + (b.y-a.y)*tt + (Math.random()-0.5)*jitter;
    arr[k*3+2] = a.z + (b.z-a.z)*tt + (Math.random()-0.5)*jitter;
  }
  s.geo.attributes.position.needsUpdate = true;
  s.life = 0; s.ttl = 0.18 + Math.random()*0.22;
}

// ---- Interaction: drag to rotate freely (with inertia), scroll/pinch to zoom ----
let isDragging = false, prevX = 0, prevY = 0;
let targetRotY = 0, targetRotX = 0, rotY = 0, rotX = 0;
let velY = 0, velX = 0;          // spin momentum after release
let userInteracted = false;      // once the user grabs it, auto-spin steps back
let zoom = 135;

function down(x,y){ isDragging=true; userInteracted=true; velY=0; velX=0; prevX=x; prevY=y; }
function move(x,y){
  if(!isDragging) return;
  const dy = (x-prevX)*0.006, dx = (y-prevY)*0.006;
  targetRotY += dy; targetRotX += dx;
  velY = dy; velX = dx;                                   // remember last motion for inertia
  targetRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotX)); // full up/down tilt
  prevX=x; prevY=y;
}
function up(){ isDragging=false; }

renderer.domElement.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
window.addEventListener('mouseup', up);
renderer.domElement.addEventListener('mouseleave', up);
renderer.domElement.addEventListener('touchstart', e=>{ if(e.touches[0]) down(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
window.addEventListener('touchmove', e=>{ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
window.addEventListener('touchend', up);

// wheel + pinch zoom
renderer.domElement.addEventListener('wheel', e=>{ zoom += e.deltaY*0.05; zoom=Math.max(60,Math.min(240,zoom)); e.preventDefault(); }, {passive:false});
let pinchStart = 0;
renderer.domElement.addEventListener('touchstart', e=>{ if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; pinchStart=Math.hypot(dx,dy); } }, {passive:true});
renderer.domElement.addEventListener('touchmove', e=>{ if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; const d=Math.hypot(dx,dy); zoom += (pinchStart-d)*0.15; zoom=Math.max(60,Math.min(240,zoom)); pinchStart=d; } }, {passive:true});

// ---- Animate ----
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // inertia: keep spinning after release, easing out
  if (!isDragging) {
    targetRotY += velY;
    targetRotX += velX;
    targetRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotX));
    velY *= 0.94; velX *= 0.94;
    if (Math.abs(velY) < 0.0002) velY = 0;
    if (Math.abs(velX) < 0.0002) velX = 0;
  }

  // smooth toward target
  rotY += (targetRotY - rotY) * 0.12;
  rotX += (targetRotX - rotX) * 0.12;

  // gentle auto-spin, but fade it out once the user has grabbed control
  const autoRot = userInteracted ? 0 : t * 0.12;
  brainGroup.rotation.y = rotY + autoRot;
  brainGroup.rotation.x = rotX;
  glassMat.uniforms.uTime.value = t;
  agentGroup.rotation.y = rotY + autoRot;
  agentGroup.rotation.x = rotX;

  // dynamic camera: gentle breathing zoom (only when user isn't manually zooming)
  const breathe = 10 * Math.sin(t * 0.35);
  camera.position.z += ((zoom + breathe) - camera.position.z) * 0.06;

  // holographic rings spin + data-nodes ride around them
  ringGroup.rotation.y = (rotY + autoRot);
  ringGroup.rotation.x = rotX;
  ringObjs.forEach(ro => {
    ro.line.rotation.z += ro.spin * 0.016;
    ro.nodes.forEach(nd => {
      const ang = nd.base + t * (ro.spin * 1.5);
      nd.sp.position.set(Math.cos(ang)*ro.r, Math.sin(ang)*ro.r, 0);
      nd.sp.material.opacity = 0.6 + 0.4*Math.sin(t*3 + nd.base);
    });
  });

  // background parallax
  bgGroup.rotation.y = (rotY + autoRot) * 0.3;

  // data packets stream outward along the horizontal traces
  const pa = pktGeo.attributes.position.array;
  for (let i = 0; i < PKT; i++) {
    const d = pktData[i];
    d.u += d.sp * 0.01;
    if (d.u > 1) d.u -= 1;                       // loop back to the inner end
    pa[i*3]   = d.x0 + (d.x1 - d.x0) * d.u;
    pa[i*3+1] = d.y;
    pa[i*3+2] = d.z;
  }
  pktGeo.attributes.position.needsUpdate = true;
  pktMat.opacity = 0.7 + 0.25 * Math.sin(t * 2.2);

  // data sphere: rotate opposite to brain + gentle shimmer (points breathe in/out)
  sphereGroup.rotation.y = (rotY + autoRot) * -0.5;
  sphereGroup.rotation.x = rotX;
  const sa = dsGeo.attributes.position.array;
  for (let i = 0; i < DN; i++) {
    const b = dsBase[i];
    const rr = b.r * (1 + 0.03 * Math.sin(t * 1.5 + b.ph));
    sa[i*3]   = b.x * rr;
    sa[i*3+1] = b.y * rr;
    sa[i*3+2] = b.z * rr;
  }
  dsGeo.attributes.position.needsUpdate = true;
  dsMat.opacity = 0.55 + 0.2 * Math.sin(t * 0.8);

  // energy waves expanding outward from the core
  waveObjs.forEach(w => {
    w.t += 0.006;
    if (w.t > 1) w.t -= 1;
    const scale = 6 + w.t * SHELL;           // grow from core toward the shell
    w.ring.scale.set(scale, scale, scale);
    w.ring.rotation.y = t * 0.3;             // slight tilt so it reads as 3D
    w.ring.rotation.x = Math.PI * 0.5;
    w.m.opacity = 0.6 * (1 - w.t) * (w.t < 0.06 ? w.t/0.06 : 1); // fade in then out
  });

  // electric sparks: fire on timer, then fade
  sparkObjs.forEach(s => {
    s.next -= 0.016;
    if (s.next <= 0 && s.ttl <= 0) { fireSpark(s); s.next = 0.15 + Math.random()*0.9; }
    if (s.ttl > 0) {
      s.life += 0.016;
      const k = s.life / s.ttl;
      s.mat.opacity = k < 1 ? Math.sin(k * Math.PI) * 0.95 : 0;
      if (k >= 1) s.ttl = 0;
    }
  });

  // core filaments flicker like firing neurons
  filMat.opacity = 0.22 + 0.18 * Math.abs(Math.sin(t * 4.0));
  // HUD floor panels gently pulse
  hudPanels.forEach((m, i) => { m.opacity = 0.25 + 0.15 * Math.sin(t * 1.2 + i); });

  // pulse the point cloud brightness
  ptMat.opacity = 0.8 + 0.2 * Math.sin(t * 1.5);
  core.scale.setScalar(36 + 4 * Math.sin(t * 2.0));
  coreMat.opacity = 0.75 + 0.2 * Math.sin(t * 2.0);

  // agents: bob + traveling pulses + labels
  agentObjs.forEach(o => {
    o.sp.scale.setScalar(8 + 2 * Math.sin(t*2 + o.phase));
    const k = (Math.sin(t*1.2 + o.phase) * 0.5 + 0.5); // 0..1
    o.pulse.position.lerpVectors(o.pos, o.target, k);
    o.pulse.material.opacity = 0.9 * (1 - Math.abs(k - 0.5) * 1.2);

    // project label to screen
    const world = o.pos.clone().applyMatrix4(agentGroup.matrixWorld);
    const proj = world.project(camera);
    const sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
    if (proj.z < 1) {
      o.label.style.display = 'block';
      o.label.style.left = sx + 'px';
      o.label.style.top = (sy - 16) + 'px';
    } else { o.label.style.display = 'none'; }
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- live clock (top-right, like the old Station) ----
const clockEl = document.getElementById('clock');
function tickClock(){ const d=new Date(); clockEl.textContent = [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }
tickClock(); setInterval(tickClock, 1000);

// ---- Recherche-Terminal: real eRank · Live-Etsy log stream (from the old Station) ----
const tbody = document.getElementById('tbody');
const LOG_LINES = [
  'eRank » scan keyword_pool q1/26 ......... OK',
  'GET etsy.com/search?q=nachlassplaner  200',
  'rank[nachlassplaner] competition=LOW  ✓',
  'tag_gen » 13/13 long-tail matched',
  'title.len check » 140 » 4 over_limit',
  'trend[caregiver organizer] +18% mom',
  'sku SELF-STARTKLAR bundle=40files zip OK',
  'thumb render 2000x2000 headless_chrome',
  'QA pdf 12/12 intact · xlsx 3/3 formula ✓',
  'sync ARBEITSSTAND.md -> gist push HEAD',
  'niche[landlord_mgmt_kit] EN price=$19.90',
  'gemini.rate thumb=9.5/10 prev="unsichtbar"',
  'oauth chatgpt » 5h_limit replan +15min',
  'crawl live-etsy » 42 listings sampled',
  'kw density check » 0.82 optimal',
  'export listing.md · tags.csv · seo.json',
];
// colorize: trailing OK/✓/200 as green, leading token before » as cyan
function fmtLog(s){
  let h = s.replace(/(\bOK\b|✓|\b200\b)/g, '<span class="ok">$1</span>');
  h = h.replace(/^([a-zA-Z_.\[\]]+)(\s»)/, '<span class="tk">$1</span>$2');
  return h;
}
let logIdx = 0;
const termLines = [];
function pushLog(){
  termLines.push('<div class="ln">› ' + fmtLog(LOG_LINES[logIdx % LOG_LINES.length]) + '</div>');
  logIdx++;
  if (termLines.length > 8) termLines.shift();
  tbody.innerHTML = termLines.join('');
}
for (let i=0;i<7;i++) pushLog();
setInterval(pushLog, 1800);
</script>
